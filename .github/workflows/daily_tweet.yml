name: 5x Daily Scheduled Tweet Automation

on:
  schedule:
    # Runs 5 times every day (Times shown in IST - Indian Standard Time UTC+5:30):
    # 03:30 UTC -> 09:00 AM IST
    # 06:30 UTC -> 12:00 PM IST
    # 09:30 UTC -> 03:00 PM IST
    # 12:30 UTC -> 06:00 PM IST
    # 15:30 UTC -> 09:00 PM IST
    - cron: '30 3,6,9,12,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Allows GitHub Actions to save the updated queue back to repo

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post Next Scheduled Tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python tweet_bot.py

      - name: Commit and Push Updated Queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets_queue.json
          git diff --staged --quiet || (git commit -m "Auto: marked tweet as posted [skip ci]" && git push)
